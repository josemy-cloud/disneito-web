<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accede a NuHio</title>
  <style>
    :root {color-scheme:light;--ink:#102843;--muted:#496580;--accent:#145bb7;--line:#cadcf2}
    * {box-sizing:border-box}
    body {margin:0;background:#eef5ff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
    .access {min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 85% 10%,#d3e6ff,transparent 60%)}
    .access-shell {display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,1fr);width:min(100%,1060px);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 24px 70px #153b6926;border:1px solid #cbdcf1}
    .access-brand {display:grid;align-content:center;gap:13px;padding:clamp(24px,4vw,48px);background:radial-gradient(ellipse at 85% 70%,#174a83,#0b213d 72%);color:#f6faff}
    .brand-name {display:block;width:174px;max-width:100%;height:auto;padding:5px;border-radius:9px;background:#fff}
    .access-brand h1 {margin:6px 0 0;font-size:clamp(29px,3.6vw,47px);line-height:1.08;letter-spacing:-.045em;font-weight:750;max-width:15ch}
    .access-brand p {margin:0;color:#d1e6ff;font-size:.95rem;max-width:38ch}
    .access-preview {margin:4px 0 0;border:1px solid #638eb670;border-radius:14px;background:#0c2748;overflow:hidden}
    .access-preview figcaption {display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid #638eb650;color:#d8eaff;font-size:.75rem;font-weight:650}
    .access-preview figcaption span {color:#b8daff;background:#244b75;border-radius:5px;padding:2px 6px;white-space:nowrap}
    .access-preview svg {width:100%;height:auto;display:block}
    .access-form {min-width:0;display:grid;align-content:center;padding:clamp(24px,4vw,48px)}
    .access-kicker {margin:0 0 8px;color:#145bb7;font-size:.72rem;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
    #accountBox {position:static!important;inset:auto!important;margin:0!important;padding:0!important;background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important;overflow:visible!important;color:var(--ink)!important;font:inherit!important}
    #accountBox > div + div {max-width:none!important;margin:14px 0 0!important}
    #accountBox h2,#accessFallback h2 {margin:0;font-size:clamp(25px,3vw,34px);line-height:1.15;letter-spacing:-.045em}
    #accountBox p,#accessFallback p {color:var(--muted)!important;font-size:.91rem;margin:0 0 16px}
    #accountBox [role="status"]:empty {display:none}
    #accountBox [role="status"]:not(:empty) {margin:10px 0 0;overflow-wrap:anywhere}
    #accountBox label {color:var(--ink)!important;font-size:.875rem}
    #accountBox input:not([type="checkbox"]) {width:100%!important;min-height:46px;border:1px solid var(--line)!important;border-radius:10px!important;background:#fff!important;color:var(--ink)!important;font:inherit!important;font-size:16px!important;padding:10px 12px!important}
    #accountBox input[type="checkbox"] {accent-color:var(--accent);flex:none}
    #accountBox small {color:var(--muted)!important}
    #accountBox button {min-height:44px;margin:4px 6px 0 0!important;padding:9px 12px!important;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--accent);font:600 .875rem/1.25 system-ui,sans-serif;cursor:pointer}
    #accountBox button:hover {background:#eaf2ff}
    #accountBox button[type="submit"] {width:100%;margin:4px 0 10px!important;border-color:var(--accent);background:var(--accent);color:#fff}
    #accountBox button[type="submit"]:hover {background:#245bb0}
    #accountBox button:disabled {opacity:.65;cursor:wait}
    #accountBox :focus-visible,#accessFallback a:focus-visible {outline:2px solid var(--accent);outline-offset:3px}
    #accessFallback a {color:var(--accent)}
    @media(max-width:700px) {
      .access {padding:12px}
      .access-shell {grid-template-columns:1fr;max-width:460px;border-radius:18px}
      .access-brand {padding:14px 20px}
      .access-brand h1,.access-brand p,.access-preview {display:none}
      .brand-name {width:150px}
      .access-form {padding:20px}
    }
    @media(max-width:360px) {
      .access {padding:8px}
      .access-form {padding:16px}
    }
  </style>
</head>
<body>
  <main class="access">
    <div class="access-shell">
      <div class="access-brand">
        <img class="brand-name" src="/nuhio-logo.webp" width="582" height="162" alt="NuHio. Tu futuro hogar comienza aquí">
        <h1>Del plano a tu próximo hogar</h1>
        <p>Dibuja, amuebla y visualiza tus espacios en 2D y 3D.</p>
        <figure class="access-preview">
          <figcaption>Vista del estudio <span>Plano + 3D</span></figcaption>
          <svg viewBox="0 0 440 202" aria-hidden="true">
            <defs>
              <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#76a9e4" stroke-opacity=".2"/></pattern>
              <linearGradient id="floor" x2="1" y2="1"><stop stop-color="#c2e1ff"/><stop offset="1" stop-color="#6ea1d9"/></linearGradient>
            </defs>
            <path d="M0 0h440v202H0z" fill="url(#grid)"/>
            <path d="M218 0v202" stroke="#638eb6" stroke-opacity=".45"/>
            <g fill="none" stroke="#b9deff" stroke-linejoin="round">
              <path d="M38 44h148v118H38zM124 44v46m0 29v43m0-43a29 29 0 0 0 29-29h-29" stroke-width="3"/>
              <rect x="49" y="56" width="63" height="25" rx="5" fill="#70a9e2" fill-opacity=".3"/>
              <path d="M55 59v19m51-19v19M55 71h51"/>
              <rect x="61" y="94" width="37" height="19" rx="5"/>
              <rect x="141" y="55" width="33" height="28" rx="4" fill="#70a9e2" fill-opacity=".3"/>
              <path d="M145 64h25M39 31h146m-146-4v8m146-8v8M27 44v118m-4-118h8m-8 118h8" opacity=".65"/>
            </g>
            <g stroke="#9bc7f0" stroke-linejoin="round">
              <path d="m237 124 91-50 93 52-91 53z" fill="url(#floor)"/>
              <path d="m237 124 93 55 91-53v9l-91 54-93-56z" fill="#3e6da0"/>
              <path d="m237 124 91-50V27l-91 49z" fill="#5888be"/>
              <path d="m328 74 93 52V79l-93-52z" fill="#8db6df"/>
              <path d="m346 48 47 26v27l-47-26z" fill="#123a66"/>
              <path d="m370 62v27m-24-28 47 26" fill="none"/>
              <path d="m256 111 49-27 34 19-50 28z" fill="#e4effe"/>
              <path d="m256 111 33 20 50-28v13l-50 29-33-19z" fill="#597fa8"/>
              <path d="m256 111 49-27V69l-49 26z" fill="#a8d0f7"/>
              <path d="m304 142 27-15 24 13-27 16z" fill="#f3d3a5" stroke="#d4aa78"/>
            </g>
          </svg>
        </figure>
      </div>
      <section class="access-form" id="accessForm" aria-label="Acceso a NuHio">
        <p class="access-kicker">Tu estudio de diseño</p>
        <div id="accessFallback">
          <h2>Accede a NuHio</h2>
          <p id="accessFallbackStatus" role="status">Preparando el formulario de acceso…</p>
          <a href="/acceso">Volver a cargar</a>
          <noscript><p>Activa JavaScript para iniciar sesión.</p></noscript>
        </div>
      </section>
    </div>
  </main>
  <script>
    const accessLoadTimer=setTimeout(()=>{
      document.getElementById('accessFallbackStatus').textContent='El formulario está tardando en cargar. Puedes volver a intentarlo.';
    },8000);
  </script>
  <script src="/auth.js?v=7"></script>
  <script>
    (async()=>{
      const fallback=document.getElementById('accessFallback');
      if(typeof accountPanel!=='function'){
        clearTimeout(accessLoadTimer);
        document.getElementById('accessFallbackStatus').textContent='No se pudo cargar el formulario. Vuelve a intentarlo.';
        return;
      }
      try{
        await accountPanel({entry:true});
        clearTimeout(accessLoadTimer);
        fallback.hidden=true;
        const box=document.getElementById('accountBox');
        document.getElementById('accessForm').append(box);
        const status=document.createElement('p');
        status.setAttribute('role','status');
        box.append(status);
        if(!SES||location.hash)return;

        const cancel=new AbortController();
        const stop=()=>cancel.abort();
        box.addEventListener('focusin',stop,{once:true});
        box.addEventListener('pointerdown',stop,{once:true});
        status.textContent='Comprobando la sesión guardada…';
        try{await enterEditor(AbortSignal.any([cancel.signal,AbortSignal.timeout(12000)]))}
        catch{
          status.textContent=cancel.signal.aborted?'':'No se pudo recuperar la sesión guardada. Puedes iniciar sesión de nuevo.';
        }finally{
          box.removeEventListener('focusin',stop);
          box.removeEventListener('pointerdown',stop);
        }
      }catch{
        clearTimeout(accessLoadTimer);
        fallback.hidden=false;
        document.getElementById('accountBox')?.remove();
        document.getElementById('accessFallbackStatus').textContent='No se pudo abrir el formulario. Vuelve a intentarlo.';
      }
    })();
  </script>
</body>
</html>
