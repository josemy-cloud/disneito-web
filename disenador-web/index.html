 // Pie de apoyo trasero y volumen inferior suavizado.
 const footProfile=[new T.Vector2(0,0),new T.Vector2(w*.18,0),new T.Vector2(w*.25,3),new T.Vector2(w*.29,9),new T.Vector2(w*.31,h*.2),new T.Vector2(w*.34,h*.32)];
