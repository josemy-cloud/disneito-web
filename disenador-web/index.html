function upholsteredCushionGeometry(width,height,depth,axis){
 const segments=axis==='y'?[20,6,16]:[20,16,6];

 for(let i=0;i<position.count;i++){
  const x=position.getX(i),y=position.getY(i),z=position.getZ(i);
  const bx=clamp(x,cx),by=clamp(y,cy),bz=clamp(z,cz);
  const dx=x-bx,dy=y-by,dz=z-bz,length=Math.hypot(dx,dy,dz);

  const px=bx+nx*r,py=by+ny*r,pz=bz+nz*r;
  const vertical=axis==='z',u=px/hx,v=vertical?py/hy:pz/hz;

  const gv=(.34*v*(1-u*u)-.085*mask*(2*slope*band+wave*(6*v**5-8*v**7)))/(vertical?hy:hz);
  const face=vertical?nz:ny,offset=(vertical?pz:py)*face/compression;

  uv.setXY(i,uv.getX(i)*uvWidth/42,uv.getY(i)*uvHeight/42);

}
