    photo() { mode = 'foto'; sz(); pt.setScene(scene, cam); pt.reset(); ctrl.state = 'renderizando'; },

/* ===== Producto comercial investigado: Roca Ona A357687000 =====
   Dimensiones exteriores oficiales: 530 × 360 × 420 mm.
   La geometría es una reconstrucción paramétrica propia; los radios no acotados

BUILD.rocaOnaBidet=(g,it,mt)=>{
 const w=it.w||36,h=it.h||42,d=it.d||53;
 const porcelain=ceramicMaterial(it.col||'#f4f3ef');
 const inner=new T.MeshStandardMaterial({color:'#e4e5e1',roughness:.19,metalness:0,side:T.DoubleSide});
 const drainMat=M('#7c8589',.24,.72),holeMat=M('#343a3d',.28,.25);
 const oval=(rx,rz,yy,thick,mat,segments=64)=>{
  const geo=new T.TorusGeometry(1,thick,10,segments);
  const mesh=new T.Mesh(geo,mat);mesh.rotation.x=Math.PI/2;
  mesh.scale.set(rx,rz,1);mesh.position.y=yy;g.add(mesh);return mesh
 };
 // Cuerpo exterior de porcelana, con perfil continuo y hombros redondeados.
 const outerProfile=[
  new T.Vector2(0,2),new T.Vector2(w*.19,2),new T.Vector2(w*.29,4),
  new T.Vector2(w*.36,12),new T.Vector2(w*.43,h*.18),
  new T.Vector2(w*.49,h*.48),new T.Vector2(w*.5,h*.72),
  new T.Vector2(w*.48,h*.91),new T.Vector2(w*.455,h*.965)
 ];
 const shell=new T.Mesh(new T.LatheGeometry(outerProfile,72),porcelain);
 shell.scale.z=d/w;shell.position.z=0;g.add(shell);
 // Vaciado interior profundo: pared interior separada para dar espesor real al borde.
 const cavityProfile=[
  new T.Vector2(0,h*.34),new T.Vector2(w*.12,h*.34),
  new T.Vector2(w*.22,h*.39),new T.Vector2(w*.31,h*.52),
  new T.Vector2(w*.385,h*.72),new T.Vector2(w*.405,h*.88),
  new T.Vector2(w*.418,h*.945)
 ];
 const cavity=new T.Mesh(new T.LatheGeometry(cavityProfile,72),inner);
 cavity.scale.z=d/w;cavity.position.y=0;g.add(cavity);
 // Labio perimetral ovalado, con superficie de porcelana continua.
 const lip=oval(w*.455,d*.455,h*.965,Math.max(.65,w*.012),porcelain);
 // Fondo curvado de la cubeta y salida de desagüe visible.
 const basin=new T.Mesh(new T.SphereGeometry(1,48,32),inner);
 basin.scale.set(w*.235,h*.055,d*.215);basin.position.set(0,h*.39,d*.025);g.add(basin);
 const drainRing=new T.Mesh(new T.TorusGeometry(w*.035,Math.max(.7,w*.006),10,36),drainMat);
 drainRing.rotation.x=Math.PI/2;drainRing.position.set(0,h*.345,d*.035);g.add(drainRing);
 const drain=new T.Mesh(new T.CircleGeometry(w*.029,36),holeMat);
 drain.rotation.x=-Math.PI/2;drain.position.set(0,h*.345+.15,d*.035);g.add(drain);
 // Plataforma trasera para grifería y orificio de montaje (sin incluir grifo).
 const deck=new T.Mesh(new T.SphereGeometry(1,40,24),porcelain);
 deck.scale.set(w*.34,h*.035,d*.105);deck.position.set(0,h*.965,-d*.335);g.add(deck);
 const tapRing=new T.Mesh(new T.TorusGeometry(w*.047,Math.max(.8,w*.009),10,36),drainMat);
 tapRing.rotation.x=Math.PI/2;tapRing.position.set(0,h*.99,-d*.365);g.add(tapRing);
 const tapHole=new T.Mesh(new T.CircleGeometry(w*.038,36),holeMat);
 tapHole.rotation.x=-Math.PI/2;tapHole.position.set(0,h*.99+.1,-d*.365);g.add(tapHole);
 // Pie de apoyo trasero y volumen inferior suavizado.
 const footProfile=[new T.Vector2(0,0),new T.Vector2(w*.18,0),new T.Vector2(w*.25,3),new T.Vector2(w*.29,9),new T.Vector2(w*.31,h*.2),new T.Vector2(w*.34,h*.32)];
 const foot=new T.Mesh(new T.LatheGeometry(footProfile,64),porcelain);
 foot.scale.z=d/w;foot.position.z=-d*.035;g.add(foot);

};



/* Roca Ona WC suspendido A346687000. Dimensiones oficiales 530×360×290 mm.

BUILD.rocaOnaWallHungWC=(g,it)=>{
 const w=it.w||36,h=it.h||29,d=it.d||53,porcelain=ceramicMaterial(it.col||'#f5f4f0');
 const seatMat=ceramicMaterial(it.seatColor||it.col||'#f8f7f3');
 const inner=new T.MeshStandardMaterial({color:'#d9ddda',roughness:.24,side:T.DoubleSide});
 const metal=M('#aeb4b7',.3,.78),hole=M('#33383b',.28,.2);
 // Perfil exterior de la taza, con caída frontal y volumen posterior de anclaje.
 const outer=[new T.Vector2(0,2),new T.Vector2(w*.22,2),new T.Vector2(w*.34,3),
  new T.Vector2(w*.43,7),new T.Vector2(w*.48,h*.28),new T.Vector2(w*.5,h*.57),
  new T.Vector2(w*.47,h*.78),new T.Vector2(w*.43,h*.94)];
 const shell=new T.Mesh(new T.LatheGeometry(outer,72),porcelain);
 shell.scale.z=d/w*.82;shell.position.set(0,0,d*.04);g.add(shell);
 // Cuenco interior profundo, abierto y sin reborde convencional (Rimless).
 const inside=[new T.Vector2(0,h*.25),new T.Vector2(w*.13,h*.25),
  new T.Vector2(w*.25,h*.3),new T.Vector2(w*.34,h*.43),
  new T.Vector2(w*.405,h*.62),new T.Vector2(w*.425,h*.82),
  new T.Vector2(w*.42,h*.91)];
 const cavity=new T.Mesh(new T.LatheGeometry(inside,72),inner);
 cavity.scale.z=d/w*.82;cavity.position.set(0,h*.01,d*.04);g.add(cavity);
 // Aro de asiento ovalado con hueco real, no un disco plano.
 const ringShape=new T.Shape();
 ringShape.absellipse(0,0,w*.47,d*.445,0,Math.PI*2,false,0);
 const ringHole=new T.Path();
 ringHole.absellipse(0,0,w*.315,d*.285,0,Math.PI*2,true,0);
 ringShape.holes.push(ringHole);
 const ringGeo=new T.ExtrudeGeometry(ringShape,{depth:1.35,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.65,bevelThickness:.55,curveSegments:64});
 const ring=new T.Mesh(ringGeo,seatMat);ring.rotation.x=Math.PI/2;ring.position.set(0,h*.92,d*.045);g.add(ring);
 // Tapa fina independiente, cerrada, con contorno ovalado y bisel suave.
 const lidShape=new T.Shape();lidShape.absellipse(0,0,w*.475,d*.45,0,Math.PI*2,false,0);
 const lidGeo=new T.ExtrudeGeometry(lidShape,{depth:1.6,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.7,bevelThickness:.5,curveSegments:64});
 const lid=new T.Mesh(lidGeo,seatMat);lid.rotation.x=Math.PI/2;lid.position.set(0,h*.955,d*.045);g.add(lid);
 // Parte posterior maciza y plano de contacto con bastidor empotrado.
 const rear=new T.Mesh(new T.BoxGeometry(w*.72,h*.25,d*.17,4,3,3),porcelain);
 rear.position.set(0,h*.76,-d*.35);g.add(rear);
 // Dos alojamientos de fijación posteriores, visibles al mirar desde atrás.
 for(const x of [-1,1]){
  const washer=new T.Mesh(new T.TorusGeometry(2.1,.65,10,24),metal);
  washer.rotation.x=Math.PI/2;washer.position.set(x*w*.29,h*.69,-d*.405);g.add(washer);
  const bore=new T.Mesh(new T.CircleGeometry(1.45,24),hole);
  bore.rotation.x=-Math.PI/2;bore.position.set(x*w*.29,h*.69+.1,-d*.405);g.add(bore);
 }
 // Sombra y superficies físicas.
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
};
